        transform-style: preserve-3d;
        transform: translateZ(0);
      }

      .app-loaded #loading-screen {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease-out;

      @media (prefers-reduced-motion: reduce) {
        #loading-screen * {
          animation: none !important;
        }
        #loading-screen h1:nth-child(2) {
          width: 100% !important;
        }

        #loading-screen h1 {
          font-size: 2rem !important;

        @keyframes cuttingBar {
          0%, 100% { transform: translateX(-5px); opacity: 0; }

        }
        @keyframes revealText {
          0%, 100% { width: 0%; }
          50% { width: 100%; }

    <!-- Service Worker Registration -->
    <script>
      // Register Service Worker
      if ("serviceWorker" in navigator) {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloaded = false;
        // A new version took over: reload once so the page and its scripts match
        // (not on a first visit, and never in a loop).
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || reloaded) return;
          reloaded = true;
          window.location.reload();
        });
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("%BASE_URL%sw.js", { updateViaCache: "none" })
            .then((registration) => registration.update())
            .catch(() => {});
        });
      }

      // PWA Install Prompt
      let deferredPrompt;
      const pwaInstall = document.getElementById("pwa-install");
      const installBtn = document.getElementById("pwa-install-btn");
      const dismissBtn = document.getElementById("pwa-dismiss-btn");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;

        // Check if user previously dismissed
        if (!localStorage.getItem("pwa-dismissed")) {
          pwaInstall.style.display = "block";
        }
      });

      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`PWA install: ${outcome}`);
          deferredPrompt = null;
          pwaInstall.style.display = "none";
        }
      });

      dismissBtn.addEventListener("click", () => {
        pwaInstall.style.display = "none";
        localStorage.setItem("pwa-dismissed", "true");
      });

      // Enhanced device optimization
      function optimizeForDevice() {
        const isLowEnd =
          navigator.hardwareConcurrency <= 2 ||
          navigator.deviceMemory <= 2 ||
          /Android.*Chrome.*Mobile|iPhone|iPad/.test(navigator.userAgent);

        if (isLowEnd) {
          const style = document.createElement("style");
          style.textContent = `
            #loading-screen * {
              animation-duration: 2s !important;
              animation-timing-function: linear !important;
            }
            @keyframes cuttingBar {
              0%, 100% { transform: translateX(0); opacity: 0; }
              50% { transform: translateX(250px); opacity: 1; }
            }
            @keyframes revealText {
              0%, 100% { width: 0%; }
              50% { width: 100%; }
            }
          `;
          document.head.appendChild(style);
        }

        // Very low-end device detection
        if (navigator.hardwareConcurrency <= 1 || navigator.deviceMemory <= 1) {
          const ultraLowStyle = document.createElement("style");
          ultraLowStyle.textContent = `
            #loading-screen { background: #1e293b !important; }
            #loading-screen * { animation: none !important; }
            #loading-screen h1:nth-child(2) { width: 100% !important; }
          `;
          document.head.appendChild(ultraLowStyle);
        }
      }

      // Hide loading screen when app loads
      window.addEventListener("load", () => {
        optimizeForDevice();

        setTimeout(() => {
          document.body.classList.add("app-loaded");
          setTimeout(() => {
            const loadingScreen = document.getElementById("loading-screen");
            if (loadingScreen) loadingScreen.style.display = "none";
          }, 600);
        }, 1000);
      });

      // Show update notification
      function showUpdateNotification() {
        if (confirm("🔄 يتوفر تحديث جديد للتطبيق. هل تريد تحديثه الآن؟")) {
          window.location.reload();
        }
      }

      console.log("🛡️ MrPheonixX Team - SAO Arabic Reader Initialized");
      console.log(
        "📊 Visit: https://bit.ly/452l2pB | Discord: https://bit.ly/4mvCWHb | Patreon: https://bit.ly/MrPheonixX",
      );
