name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # npm install (not npm ci) so a lockfile that drifted from package.json
      # can never fail the deploy.
      - run: npm install --no-audit --no-fund

      # Stops the deploy if the code uses a name that does not exist
      # (such a mistake builds fine but crashes the page when it opens).
      - name: Check for undefined names
        run: node scripts/check-names.mjs

      # https://<user>.github.io/<repo>/  ->  base "/<repo>/"
      # https://<user>.github.io/ (repo named <user>.github.io)  ->  base "/"
      - name: Work out the site base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) BASE="/" ;;
            *)           BASE="/${REPO}/" ;;
          esac
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "path=${BASE}" >> "$GITHUB_OUTPUT"
          echo "site=https://${OWNER}.github.io${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build the site (client only, no server needed)
        run: npm run build:client
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
          VITE_SITE_URL: ${{ steps.base.outputs.site }}
          # Set the repository variable ADSENSE_CLIENT (Settings > Variables) to enable ads
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}

      # The novels live inside the site itself (books/ folder), so readers never
      # leave the website. Files committed in public/books/ are kept; every other
      # PDF of the content repository is copied in.
      - name: Add the novel files to the site
        env:
          CONTENT_REPO: ${{ vars.CONTENT_REPO || 'MrPheonixX/My-Works-PDF-' }}
        run: |
          mkdir -p books-staging
          if git clone --depth 1 "https://github.com/${CONTENT_REPO}.git" content-repo; then
            find content-repo -type f -iname '*.pdf' -not -path '*/.git/*' -print0 | xargs -0 -I{} cp --update=none "{}" books-staging/
          else
            echo "::warning::could not clone ${CONTENT_REPO}: only the books committed in public/books/ will be inside the site"
          fi
          ls books-staging | wc -l

      - name: Prepare the Pages artifact
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
        run: |
          rm -rf pages-out
          cp -r dist/spa pages-out
          # Pages has no SPA fallback: unknown paths get 404.html, which is the app itself.
          cp pages-out/index.html pages-out/404.html
          touch pages-out/.nojekyll
          mkdir -p pages-out/books
          cp --update=none books-staging/*.pdf pages-out/books/ 2>/dev/null || true
          node scripts/check-books.mjs pages-out

          # Guards: fail loudly instead of publishing a broken site.
          if grep -q '/client/App.tsx' pages-out/index.html; then
            echo "::error::index.html is the unbuilt template (the build did not run)"; exit 1
          fi
          if grep -q '%VITE_' pages-out/index.html; then
            echo "::error::an index.html placeholder (%VITE_...%) was not replaced"; exit 1
          fi
          if [ "${PAGES_BASE}" != "/" ] && grep -Eq '(src|href)="/(assets|favicon|manifest|icons)' pages-out/index.html; then
            echo "::error::index.html still has root-relative URLs; the site would 404 under ${PAGES_BASE}"; exit 1
          fi
          if grep -R -q --exclude-dir=books 'service_role' pages-out 2>/dev/null; then
            echo "::error::a service_role key must never be shipped to the browser"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
